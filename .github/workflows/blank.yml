
name: ULTRA CLOUD PC - Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar site
        run: |
          mkdir -p public

          if [ -f index.html ]; then
            cp index.html public/
          elif [ -f web/index.html ]; then
            cp -r web/. public/
          else
            echo "Arquivo index.html não encontrado!"
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar ULTRA CLOUD PC
        id: deployment
        uses: actions/deploy-pages@v4
